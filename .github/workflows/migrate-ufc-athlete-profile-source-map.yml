name: Migrate audited UFC athlete profile source map

on:
  push:
    branches: [main]
    paths:
      - "pipelines/migrate_ufc_athlete_profile_source_map.py"
      - ".github/workflows/migrate-ufc-athlete-profile-source-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate, validate, and commit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs provenance/audits
          log="provenance/runs/ufc_athlete_profile_source_map_${GITHUB_RUN_ID}.log"
          set +e
          {
            python pipelines/migrate_ufc_athlete_profile_source_map.py
            python pipelines/validate_source_field_map.py
          } >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          with open("provenance/runs/ufc_athlete_profile_source_map_latest.json", "w", encoding="utf-8") as fh:
              json.dump({
                  "schema_version": 1,
                  "migration": "ufc_athlete_profile_source_map",
                  "status": "success" if code == 0 else "failed",
                  "exit_code": code,
                  "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "trigger_sha": os.environ.get("GITHUB_SHA"),
                  "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  "log": log,
              }, fh, indent=2, sort_keys=True); fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_athlete_profile_source_map_latest.json
          if [ "$code" -eq 0 ]; then git add schemas/source_field_map_v0.json; fi
          git commit -m "Migrate UFC athlete profile source map (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
