name: Snapshot free ESPN MMA additive data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-espn-mma.yml"
      - "pipelines/ingest_espn_mma.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-espn-mma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out writable branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot ESPN MMA history and additive fight surfaces
        run: python pipelines/ingest_espn_mma.py

      - name: Commit immutable raw snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add data/raw/espn_mma
          if git diff --cached --quiet; then
            echo "No ESPN MMA snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot free ESPN MMA additive data [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
