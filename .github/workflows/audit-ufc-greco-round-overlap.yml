name: Audit official UFC FightMetric versus Greco round stats

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_ufc_greco_round_overlap.py"
      - ".github/workflows/audit-ufc-greco-round-overlap.yml"
      - "data/derived/identity/ufc_fightmetric_fight_crosswalk_candidate.csv"
      - "data/derived/identity/ufc_fight_event_bridge_candidate.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/audit_ufc_greco_round_overlap.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            provenance/audits/ufc_greco_round_overlap_latest.json \
            provenance/audits/ufc_greco_round_overlap_latest.md \
            data/derived/identity/ufc_greco_fight_alignment_candidate.csv \
            data/derived/qa/fightmetric_duplicate_version_greco_scores.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit official UFC versus Greco round stats [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
