name: Audit official UFC FightMetric versus Greco round stats

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_ufc_greco_round_overlap.py"
      - ".github/workflows/audit-ufc-greco-round-overlap.yml"
      - "data/derived/identity/ufc_fightmetric_fight_crosswalk_candidate.csv"
      - "data/derived/identity/ufc_fight_event_bridge_candidate.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit with durable diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs data/derived/identity data/derived/qa
          log="provenance/runs/ufc_greco_round_overlap_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/audit_ufc_greco_round_overlap.py >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "audit": "ufc_greco_round_overlap",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
              "outputs": [
                  "provenance/audits/ufc_greco_round_overlap_latest.json",
                  "provenance/audits/ufc_greco_round_overlap_latest.md",
                  "data/derived/identity/ufc_greco_fight_alignment_candidate.csv",
                  "data/derived/qa/fightmetric_duplicate_version_greco_scores.csv",
              ] if code == 0 else [],
          }
          with open("provenance/runs/ufc_greco_round_overlap_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_greco_round_overlap_latest.json
          for p in \
            provenance/audits/ufc_greco_round_overlap_latest.json \
            provenance/audits/ufc_greco_round_overlap_latest.md \
            data/derived/identity/ufc_greco_fight_alignment_candidate.csv \
            data/derived/qa/fightmetric_duplicate_version_greco_scores.csv; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          git commit -m "Record UFC versus Greco round audit (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
