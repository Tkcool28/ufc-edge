name: Test UFC data adapters

on:
  push:
    branches: [main]
    paths:
      - "pipelines/adapters/**"
      - "tests/test_adapter_common.py"
      - ".github/workflows/test-data-adapters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adapter unit tests
        run: python -m unittest discover -s tests -p 'test_adapter_common.py' -v
