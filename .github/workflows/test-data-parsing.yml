name: Test canonical data parsing

on:
  push:
    branches: [main]
    paths:
      - "src/ufc_edge/data/**"
      - "tests/test_canonical_parsing.py"
      - ".github/workflows/test-data-parsing.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_canonical_parsing -v
