name: Build context-clean UFC weigh-in canonical candidate v2

on:
  push:
    branches: [main]
    paths:
      - "pipelines/build_ufc_weigh_in_canonical_candidate_v2.py"
      - "data/derived/identity/ufc_weigh_in_identity_candidate.csv"
      - "data/canonical/v0/fights.csv"
      - ".github/workflows/build-ufc-weigh-in-canonical-candidate-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, audit, and commit
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p provenance/runs provenance/audits data/derived/identity
          log="provenance/runs/ufc_weigh_in_canonical_candidate_v2_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/build_ufc_weigh_in_canonical_candidate_v2.py >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "build": "ufc_weigh_in_canonical_candidate_v2",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/ufc_weigh_in_canonical_candidate_v2_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_weigh_in_canonical_candidate_v2_latest.json
          if [ "$code" -eq 0 ]; then
            git add data/derived/identity/ufc_weigh_in_canonical_candidate_v2.csv \
              provenance/audits/ufc_weigh_in_canonical_candidate_v2_latest.json
          fi
          git commit -m "Build context-clean UFC weigh-in candidate v2 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
