name: Import pinned Greco UFCStats snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-greco.yml"
      - "pipelines/ingest_greco1899.py"
      - "provenance/greco1899.lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ingest-greco.yml"
      - "pipelines/ingest_greco1899.py"
      - "provenance/greco1899.lock.json"
      - "data/raw/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-raw-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and verify pinned source bytes
        run: python pipelines/ingest_greco1899.py

      - name: Commit immutable raw snapshot if absent
        shell: bash
        run: |
          set -euo pipefail
          git add data/raw/greco1899
          if git diff --cached --quiet; then
            echo "Pinned raw snapshot already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import pinned Greco1899 UFCStats snapshot [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
