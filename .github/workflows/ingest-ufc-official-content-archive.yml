name: Ingest official UFC weigh-in and scorecard archive

on:
  push:
    branches: [main]
    paths:
      - "pipelines/ingest_ufc_official_content_archive.py"
      - ".github/workflows/ingest-ufc-official-content-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run acquisition with durable diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/ufc_official_content_archive_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/ingest_ufc_official_content_archive.py >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "acquisition": "ufc_official_content_archive",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/ufc_official_content_archive_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/runs/ufc_official_content_archive_latest.json "$log"
          if [ -d data/raw/ufc_official_content ]; then git add data/raw/ufc_official_content; fi
          git commit -m "Snapshot official UFC weigh-in and scorecard archive (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
