name: Ingest official UFC weigh-in and scorecard archive

on:
  push:
    branches: [main]
    paths:
      - "pipelines/ingest_ufc_official_content_archive.py"
      - ".github/workflows/ingest-ufc-official-content-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded archive acquisition
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/ufc_official_content_${GITHUB_RUN_ID}.log"
          set +e
          timeout --signal=TERM 2400s python pipelines/ingest_ufc_official_content_archive.py >"$log" 2>&1
          code=$?
          set -e

          status="failed"
          if [ "$code" -eq 0 ]; then status="success"; fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then status="process_timeout"; fi

          latest_manifest="$(find data/raw/ufc_official_content -name manifest.json -type f 2>/dev/null | sort | tail -n1 || true)"
          failed_manifest=""
          if [ "$code" -ne 0 ] && [ -n "$latest_manifest" ]; then
            failed_manifest="provenance/runs/ufc_official_content_failed_manifest_${GITHUB_RUN_ID}.json"
            cp "$latest_manifest" "$failed_manifest"
          fi

          python - "$code" "$status" "$log" "$latest_manifest" "$failed_manifest" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, status, log, manifest, failed_manifest = sys.argv[1:]
          payload = {
              "schema_version": 1,
              "pipeline": "ufc_official_content_archive",
              "status": status,
              "exit_code": int(code),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
              "raw_manifest": manifest if int(code) == 0 and manifest else None,
              "failed_manifest_copy": failed_manifest or None,
          }
          with open("provenance/runs/ufc_official_content_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_official_content_latest.json
          if [ -n "$failed_manifest" ]; then git add "$failed_manifest"; fi
          if [ "$code" -eq 0 ]; then git add data/raw/ufc_official_content; fi
          git commit -m "Record official UFC content archive (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
