name: Fix fighter state builder Python literals
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-feature-builder-python-literals.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Patch, compile, and commit
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          python - <<'PY'
          from pathlib import Path
          p=Path('features/build_fighter_state_primitives_v0.py')
          t=p.read_text()
          t=t.replace(': true', ': True').replace(': false', ': False')
          p.write_text(t)
          PY
          python -m py_compile features/build_fighter_state_primitives_v0.py
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/build_fighter_state_primitives_v0.py
          git commit -m "Fix fighter state builder Python literals [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
