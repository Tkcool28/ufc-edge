name: Audit Greco round-stat cell encoding

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_greco_cell_encoding.py"
      - ".github/workflows/audit-greco-cell-encoding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/audit_greco_cell_encoding.py
      - name: Commit audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/audits/greco_cell_encoding_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Greco round-stat cell encoding [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
