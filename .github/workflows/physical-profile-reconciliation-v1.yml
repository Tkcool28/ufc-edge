name: Physical Profile Reconciliation V1

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ufc_edge/data/physical_profile_reconciliation.py"
      - "pipelines/build_physical_profile_canonical_reconciliation_v1.py"
      - "data/supplemental/physical_profile_recent_recovery_v1.csv"
      - "data/supplemental/ufcstats_live_recovery_targets_v1.csv"
      - "data/raw/ufcstats_live_recovery/**"
      - "pipelines/fetch_ufcstats_live_physical_recovery_v1.py"
      - "schemas/physical_profile_reconciliation_v1.json"
      - "tests/test_physical_profile_reconciliation.py"
      - ".github/workflows/physical-profile-reconciliation-v1.yml"

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-22.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse reconciliation sources
        run: python -m py_compile src/ufc_edge/data/physical_profile_reconciliation.py pipelines/build_physical_profile_canonical_reconciliation_v1.py pipelines/fetch_ufcstats_live_physical_recovery_v1.py
      - name: Run physical-profile guard tests
        run: python -m unittest discover -s tests -p 'test_physical_profile_reconciliation.py' -v
      - name: Confirm frozen v0 DATA is untouched
        run: git diff --quiet origin/main...HEAD -- data/canonical/v0 provenance/data_phase_freeze_v0.json

  evidence:
    needs: guards
    runs-on: ubuntu-22.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reconciliation evidence
        run: python pipelines/build_physical_profile_canonical_reconciliation_v1.py
      - name: Verify bounded cohort and no 2024 regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("provenance/audits/physical_profile_canonical_reconciliation_v1.json").read_text())
          assert audit["recent_cohort_rows"] == 57, audit["recent_cohort_rows"]
          assert audit["initial_recent_null_field_rows"] == 23, audit["initial_recent_null_field_rows"]
          assert audit["recovery_resolution_counts"] == {
              "RESOLVED_TRUSTED_MEASUREMENT": 12,
              "RESOLVED_CONFLICT_QUARANTINED": 3,
              "EXHAUSTED_TRUSTED_SOURCES_NO_MEASUREMENT": 8,
          }, audit["recovery_resolution_counts"]
          assert audit["non_target_canonical_changes"] == 0, audit["non_target_canonical_changes"]
          assert audit["live_ufcstats_state_counts"] == {"POPULATED": 11}, audit["live_ufcstats_state_counts"]
          assert len(audit["live_ufcstats_changed_fields"]) == 11, audit["live_ufcstats_changed_fields"]
          assert audit["live_ufcstats_check_required"] == 0, audit["live_ufcstats_check_required"]
          assert len(audit["supplemental_changed_fields"]) == 12, audit["supplemental_changed_fields"]
          cov_2024 = audit["coverage"]["2024"]
          assert cov_2024["height_before_null"] == cov_2024["height_after_null"] == 0, cov_2024
          assert cov_2024["reach_before_null"] == cov_2024["reach_after_null"] == 0, cov_2024
          cov_2025 = audit["coverage"]["2025"]
          assert cov_2025["height_before_null"] == cov_2025["height_after_null"] == 0, cov_2025
          assert cov_2025["reach_before_null"] == 1 and cov_2025["reach_after_null"] == 0, cov_2025
          cov_2026 = audit["coverage"]["2026"]
          assert cov_2026["height_before_null"] == 2 and cov_2026["height_after_null"] == 0, cov_2026
          assert cov_2026["reach_before_null"] == 20 and cov_2026["reach_after_null"] == 0, cov_2026
          print(json.dumps({"recent_cohort_rows": audit["recent_cohort_rows"], "coverage": audit["coverage"], "resolution_counts": audit["recovery_resolution_counts"]}, sort_keys=True))
          PY
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: physical-profile-canonical-reconciliation-v1
          path: |
            data/canonical/v1
            data/supplemental/physical_profile_recent_recovery_v1.csv
            data/supplemental/ufcstats_live_recovery_targets_v1.csv
            data/raw/ufcstats_live_recovery/35053621411
            data/derived/qa/physical_profile_recent_cohort_v1.csv
            data/derived/qa/physical_profile_recent_nulls_v1.csv
            data/derived/qa/physical_profile_live_ufcstats_check_required_v1.csv
            provenance/audits/physical_profile_canonical_reconciliation_v1.json
            provenance/audits/physical_profile_canonical_reconciliation_v1.md
          if-no-files-found: error
          retention-days: 30
