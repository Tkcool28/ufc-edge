name: Validate canonical data contract

on:
  push:
    branches: [main]
    paths:
      - "schemas/canonical_data_contract_v0.json"
      - "schemas/canonical_data_contract_v0.md"
      - "schemas/source_adapter_contract_v0.md"
      - "pipelines/validate_canonical_contract.py"
      - "pipelines/migrate_weigh_in_contract_observation_grain.py"
      - ".github/workflows/validate-canonical-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate known weigh-in contract defect and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          python pipelines/migrate_weigh_in_contract_observation_grain.py
          python pipelines/validate_canonical_contract.py
          if ! git diff --quiet -- schemas/canonical_data_contract_v0.json schemas/canonical_data_contract_v0.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schemas/canonical_data_contract_v0.json schemas/canonical_data_contract_v0.md
            git commit -m "Migrate weigh-in contract observation grain [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
