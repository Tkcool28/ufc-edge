name: Build and validate canonical UFC core v0

on:
  push:
    branches: [main]
    paths:
      - "pipelines/build_canonical_core_v0.py"
      - "pipelines/validate_canonical_data_v0.py"
      - "pipelines/report_canonical_core_build.py"
      - ".github/workflows/build-canonical-core-v0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, validate, and publish diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs data/canonical/v0 data/derived/qa
          log="provenance/runs/canonical_core_v0_${GITHUB_RUN_ID}.log"
          set +e
          {
            python pipelines/validate_canonical_contract.py &&
            python pipelines/validate_source_field_map.py &&
            python pipelines/build_canonical_core_v0.py &&
            python pipelines/report_canonical_core_build.py &&
            python pipelines/validate_canonical_data_v0.py
          } >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "pipeline": "canonical_core_v0",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/canonical_core_v0_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/canonical_core_v0_latest.json
          if [ "$code" -eq 0 ]; then
            git add data/canonical/v0 data/derived/qa/canonical_core_exclusions_v0.csv provenance/audits/canonical_core_v0_latest.json provenance/audits/canonical_core_v0_latest.md
          fi
          git commit -m "Build canonical UFC core v0 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
