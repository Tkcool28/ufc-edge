name: Audit Greco core transport syntax

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_greco_core_transport.py"
      - ".github/workflows/audit-greco-core-transport.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compact transport audit
        shell: bash
        run: |
          set -euo pipefail
          python pipelines/audit_greco_core_transport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/audits/greco_core_transport_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Greco core transport syntax [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
