name: F00 Exposure Remediation

on:
  push:
    branches:
      - feat/feature-contract-f00

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/feature-contract-f00
          fetch-depth: 0

      - name: Apply reviewed elapsed-exposure remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          VERSION = "0.1.1-draft"
          BLOCKED = [
              "sig_strike_flow",
              "knockdown_rate",
              "takedown_pressure",
              "control_rate",
              "submission_attempt_rate",
              "reversal_rate",
              "sig_strike_differential_rate",
              "control_differential_rate",
              "late_round_pace_ratio",
              "sig_creation_vs_prevention",
              "takedown_pressure_vs_defense",
              "control_creation_vs_allowed",
              "submission_pressure_vs_allowed",
              "pace_mismatch",
              "oa_sig_creation",
              "oa_sig_suppression",
              "oa_control_creation",
              "oa_submission_creation",
              "sim_strike_event_intensity",
              "sim_knockdown_hazard_proxy",
              "sim_takedown_attempt_intensity",
              "sim_submission_attempt_intensity",
              "sim_fatigue_persistence_multiplier",
              "historical_fight_duration",
          ]

          # ------------------------------------------------------------------
          # Catalog: explicit canonical-v0 exposure gate + effective deferrals.
          # ------------------------------------------------------------------
          catalog_path = Path("features/feature_catalog.yaml")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          catalog["feature_contract_version"] = VERSION
          catalog["elapsed_exposure_policy"] = {
              "version": 1,
              "canonical_v0_status": "no_general_safe_elapsed_round_or_fight_exposure_source",
              "allowed_sources": [],
              "blocked_feature_concepts": BLOCKED,
              "forbidden_inferences": [
                  "Do not assume every nonterminal historical round lasted 300 seconds or five minutes.",
                  "Do not derive total elapsed fight time from finish_round and finish_time_sec unless historical round-length/ruleset semantics are canonically established for that contest.",
                  "Do not treat scheduled_rounds as evidence of round length.",
                  "Do not treat control_sec as elapsed fight time, ground time, or a round-duration field.",
              ],
              "materializable_requirement": "Any concept whose value requires elapsed fight/round time must remain non-materializable unless a versioned contract names a canonical elapsed-exposure source in allowed_sources and the concept declares source-specific eligibility/provenance with contract_safe=true.",
              "promotion_requirement": "Changing a blocked concept to a materializable status requires a versioned DATA/feature-contract change that supplies and validates the elapsed-exposure source; a calculator may not invent round duration locally.",
          }
          time_rate = catalog["shrinkage_policies"]["time_rate_v1"]
          time_rate["use"] = "Reserved for a future contract version after elapsed fight/round exposure becomes contract-safe; no canonical-v0 time-rate concept is currently materializable."
          time_rate["currently_materializable"] = False

          by_name = {f["feature_name"]: f for f in catalog["features"]}
          missing = sorted(set(BLOCKED) - set(by_name))
          if missing:
              raise SystemExit(f"blocked concepts missing from catalog: {missing}")
          for name in BLOCKED:
              feature = by_name[name]
              feature["status"] = "DEFERRED"
              feature["elapsed_exposure_source"] = {
                  "source": "none_canonical_v0" if name == "historical_fight_duration" or "elapsed" in (feature["exposure_denominator"]["denominator"] + feature["exact_formula_or_definition"]).lower() else "blocked_upstream_time_state",
                  "eligibility": "No canonical-v0 materialization is eligible under elapsed_exposure_policy version 1.",
                  "provenance": "A future versioned DATA/feature-contract migration must identify the canonical elapsed-exposure source or safe upstream time-state dependency before this concept is promoted.",
                  "contract_safe": False,
              }
              gate_note = " Deferred under canonical v0 because required elapsed exposure (directly or through an upstream feature) is not contract-safe; no standard-round duration may be assumed."
              if gate_note.strip() not in feature["known_limitations"]:
                  feature["known_limitations"] = feature["known_limitations"].rstrip() + gate_note

          catalog_path.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")

          # ------------------------------------------------------------------
          # Schema: version, top-level policy contract, optional source proof.
          # ------------------------------------------------------------------
          schema_path = Path("features/feature_schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          schema["properties"]["feature_contract_version"] = {"const": VERSION}
          required = schema["required"]
          if "elapsed_exposure_policy" not in required:
              required.insert(required.index("shrinkage_policies"), "elapsed_exposure_policy")
          schema["properties"]["elapsed_exposure_policy"] = {"$ref": "#/$defs/elapsedExposurePolicy"}
          schema["$defs"]["elapsedExposurePolicy"] = {
              "type": "object",
              "additionalProperties": False,
              "required": [
                  "version",
                  "canonical_v0_status",
                  "allowed_sources",
                  "blocked_feature_concepts",
                  "forbidden_inferences",
                  "materializable_requirement",
                  "promotion_requirement",
              ],
              "properties": {
                  "version": {"const": 1},
                  "canonical_v0_status": {"const": "no_general_safe_elapsed_round_or_fight_exposure_source"},
                  "allowed_sources": {"type": "array", "items": {"type": "string", "minLength": 1}, "uniqueItems": True},
                  "blocked_feature_concepts": {"type": "array", "items": {"type": "string", "pattern": "^[a-z][a-z0-9_]*$"}, "uniqueItems": True},
                  "forbidden_inferences": {"type": "array", "items": {"type": "string", "minLength": 1}, "minItems": 1},
                  "materializable_requirement": {"type": "string", "minLength": 1},
                  "promotion_requirement": {"type": "string", "minLength": 1},
              },
          }
          schema["$defs"]["elapsedExposureSource"] = {
              "type": "object",
              "additionalProperties": False,
              "required": ["source", "eligibility", "provenance", "contract_safe"],
              "properties": {
                  "source": {"type": "string", "minLength": 1},
                  "eligibility": {"type": "string", "minLength": 1},
                  "provenance": {"type": "string", "minLength": 1},
                  "contract_safe": {"type": "boolean"},
              },
          }
          schema["$defs"]["featureConcept"]["properties"]["elapsed_exposure_source"] = {"$ref": "#/$defs/elapsedExposureSource"}
          schema_path.write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")

          # ------------------------------------------------------------------
          # Validator: generic time-denominator gate, plus explicit dependencies.
          # ------------------------------------------------------------------
          contract_path = Path("src/ufc_edge/features/contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          contract = contract.replace(
              'if catalog["feature_contract_version"] != "0.1.0-draft":\n        raise ContractError("feature_contract_version must be 0.1.0-draft for F00")',
              'if catalog["feature_contract_version"] != "0.1.1-draft":\n        raise ContractError("feature_contract_version must be 0.1.1-draft for remediated F00")',
          )
          anchor = "\ndef _validate_round_and_position_precision(feature: dict[str, Any]) -> None:\n"
          if "def _validate_elapsed_exposure_policy(" not in contract:
              block = r'''

def _uses_elapsed_time_exposure(feature: dict[str, Any]) -> bool:
    """Return true when a concept requires fight/round elapsed-time exposure.

    This intentionally keys primarily off denominator/unit semantics rather than a
    feature-name allowlist, so newly added concepts fail closed too.
    """
    denominator = feature["exposure_denominator"]["denominator"].lower().replace("-", " ")
    unit = feature["unit"].lower().replace("-", "_")
    elapsed_denominator = (
        ("elapsed" in denominator and any(token in denominator for token in ("time", "minute", "second", "fight", "round")))
        or "eligible minute" in denominator
        or "compatible minute" in denominator
        or "fight minute" in denominator
        or "fight second" in denominator
        or "round exposure" in denominator
    )
    time_unit = any(
        token in unit
        for token in (
            "per_minute",
            "per_15_minutes",
            "share_of_elapsed",
            "per_time_interval",
            "per_elapsed",
        )
    )
    return elapsed_denominator or time_unit


def _validate_elapsed_exposure_policy(catalog: dict[str, Any], features: list[dict[str, Any]]) -> None:
    policy = catalog.get("elapsed_exposure_policy")
    if not isinstance(policy, dict):
        raise ContractError("catalog must declare elapsed_exposure_policy")
    _require_keys(
        policy,
        (
            "version",
            "canonical_v0_status",
            "allowed_sources",
            "blocked_feature_concepts",
            "forbidden_inferences",
            "materializable_requirement",
            "promotion_requirement",
        ),
        "elapsed_exposure_policy",
    )
    if policy["version"] != 1:
        raise ContractError("elapsed_exposure_policy.version must be 1")
    if policy["canonical_v0_status"] != "no_general_safe_elapsed_round_or_fight_exposure_source":
        raise ContractError("canonical v0 elapsed-exposure status cannot be weakened silently")

    allowed_sources = policy["allowed_sources"]
    blocked = policy["blocked_feature_concepts"]
    if not isinstance(allowed_sources, list) or len(allowed_sources) != len(set(allowed_sources)):
        raise ContractError("elapsed_exposure_policy.allowed_sources must be a unique list")
    if not isinstance(blocked, list) or len(blocked) != len(set(blocked)):
        raise ContractError("elapsed_exposure_policy.blocked_feature_concepts must be a unique list")

    by_name = {feature["feature_name"]: feature for feature in features}
    missing = sorted(set(blocked) - set(by_name))
    if missing:
        raise ContractError(f"elapsed-exposure policy references unknown concepts: {missing}")
    for name in blocked:
        if by_name[name]["status"] != "DEFERRED":
            raise ContractError(f"{name} is blocked by canonical-v0 elapsed exposure and must remain DEFERRED")

    for feature in features:
        name = feature["feature_name"]
        source = feature.get("elapsed_exposure_source")
        if source is not None:
            if not isinstance(source, dict):
                raise ContractError(f"{name}.elapsed_exposure_source must be an object")
            _require_keys(source, ("source", "eligibility", "provenance", "contract_safe"), f"{name}.elapsed_exposure_source")
            if type(source["contract_safe"]) is not bool:
                raise ContractError(f"{name}.elapsed_exposure_source.contract_safe must be boolean")
            for field in ("source", "eligibility", "provenance"):
                if not isinstance(source[field], str) or not source[field].strip():
                    raise ContractError(f"{name}.elapsed_exposure_source.{field} must be explicit")
            if source["contract_safe"] and source["source"] not in allowed_sources:
                raise ContractError(f"{name} claims an elapsed-exposure source not allowed by the contract")

        if _uses_elapsed_time_exposure(feature) and feature["status"] not in NON_MATERIALIZED_STATUSES:
            if source is None:
                raise ContractError(f"{name} uses elapsed-time exposure but declares no contract-safe source/eligibility")
            if source["contract_safe"] is not True or source["source"] not in allowed_sources:
                raise ContractError(f"{name} uses elapsed-time exposure without a contract-safe allowed source")

        # The exact failure mode caught in master review must never return through
        # a supposedly safe source declaration.
        if source is not None:
            source_text = " ".join(str(source[key]).lower() for key in ("source", "eligibility", "provenance"))
            formula_text = feature["exact_formula_or_definition"].lower()
            combined = source_text + " " + formula_text
            if ("300 second" in combined or "five minute" in combined or "5 minute" in combined) and "assum" in combined:
                raise ContractError(f"{name} attempts to assume a standard historical round duration")
'''
              contract = contract.replace(anchor, block + anchor)
          loop_anchor = "        _validate_denominator_and_missingness(feature)\n        _validate_round_and_position_precision(feature)\n\n    _validate_targets(catalog, schema, canonical_fields)"
          replacement = "        _validate_denominator_and_missingness(feature)\n        _validate_round_and_position_precision(feature)\n\n    _validate_elapsed_exposure_policy(catalog, features)\n    _validate_targets(catalog, schema, canonical_fields)"
          if loop_anchor not in contract:
              raise SystemExit("validator insertion anchor not found")
          contract = contract.replace(loop_anchor, replacement)
          contract_path.write_text(contract, encoding="utf-8")

          # ------------------------------------------------------------------
          # Tests: regression gate + future promotion path.
          # ------------------------------------------------------------------
          tests_path = Path("tests/features/test_feature_contract.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace('self.assertEqual(summary["feature_contract_version"], "0.1.0-draft")', 'self.assertEqual(summary["feature_contract_version"], "0.1.1-draft")')
          tests = tests.replace('self.feature("sim_strike_event_intensity", catalog)["intended_model_consumers"].append("model1")', 'self.feature("sim_takedown_success_probability", catalog)["intended_model_consumers"].append("model1")')
          material_anchor = "    # Materialization naming / consumers --------------------------------\n"
          if "test_elapsed_time_feature_is_blocked_without_safe_source" not in tests:
              new_tests = '''    def test_elapsed_time_feature_is_blocked_without_safe_source(self) -> None:\n        catalog = deepcopy(self.catalog)\n        self.feature("sig_strike_flow", catalog)["status"] = "V1_MUST"\n        with self.assertRaisesRegex(ContractError, "elapsed|DEFERRED"):\n            self.validate(catalog)\n\n    def test_elapsed_exposure_blocked_concepts_are_deferred(self) -> None:\n        blocked = self.catalog["elapsed_exposure_policy"]["blocked_feature_concepts"]\n        self.assertIn("sig_strike_flow", blocked)\n        self.assertIn("historical_fight_duration", blocked)\n        for name in blocked:\n            self.assertEqual(self.feature(name)["status"], "DEFERRED", name)\n\n    def test_elapsed_exposure_can_only_be_promoted_with_allowed_source(self) -> None:\n        catalog = deepcopy(self.catalog)\n        feature = self.feature("sig_strike_flow", catalog)\n        feature["status"] = "V1_MUST"\n        feature["elapsed_exposure_source"] = {\n            "source": "canonical_round_elapsed_sec_v1",\n            "eligibility": "Only rows carrying the future canonical elapsed-round field are eligible.",\n            "provenance": "Future versioned DATA migration canonical elapsed-round field.",\n            "contract_safe": True,\n        }\n        catalog["elapsed_exposure_policy"]["allowed_sources"] = ["canonical_round_elapsed_sec_v1"]\n        catalog["elapsed_exposure_policy"]["blocked_feature_concepts"].remove("sig_strike_flow")\n        self.validate(catalog)\n\n    def test_standard_300_second_round_assumption_is_rejected(self) -> None:\n        catalog = deepcopy(self.catalog)\n        feature = self.feature("sig_strike_flow", catalog)\n        feature["status"] = "V1_MUST"\n        feature["elapsed_exposure_source"] = {\n            "source": "assumed_round_duration",\n            "eligibility": "Assume every historical nonterminal round is 300 seconds.",\n            "provenance": "Assumed five minute standard round.",\n            "contract_safe": True,\n        }\n        catalog["elapsed_exposure_policy"]["allowed_sources"] = ["assumed_round_duration"]\n        catalog["elapsed_exposure_policy"]["blocked_feature_concepts"].remove("sig_strike_flow")\n        with self.assertRaisesRegex(ContractError, "standard historical round duration"):\n            self.validate(catalog)\n\n    def test_safe_attempt_denominator_remains_materializable(self) -> None:\n        self.assertEqual(self.feature("takedown_conversion")["status"], "V1_MUST")\n        self.assertEqual(self.feature("oa_takedown_creation")["status"], "V2_OPPONENT_ADJUSTED")\n        self.assertEqual(self.feature("sim_takedown_success_probability")["status"], "SIMULATOR_COMPONENT")\n        names = materialized_feature_names(self.catalog)\n        self.assertTrue(any("takedown_conversion" in name for name in names))\n        self.assertFalse(any("sig_strike_flow" in name for name in names))\n\n'''
              tests = tests.replace(material_anchor, new_tests + material_anchor)
          tests_path.write_text(tests, encoding="utf-8")

          # ------------------------------------------------------------------
          # Human architecture docs: make the gate impossible to miss.
          # ------------------------------------------------------------------
          doc_path = Path("features/FEATURE_CONTRACT.md")
          doc = doc_path.read_text(encoding="utf-8")
          doc = doc.replace("Feature contract version: **0.1.0-draft**", f"Feature contract version: **{VERSION}**")
          section7 = '''## 7. Rates, denominators, and exposure\n\nA rate is invalid until its numerator, denominator, eligibility, zero-denominator behavior, missing-denominator behavior, and minimum support are explicit.\n\n### Canonical-v0 elapsed-exposure gate\n\nCanonical v0 does **not** expose a general elapsed-round field on `fighter_round_stats`, and it does not establish historical round-length/ruleset semantics broadly enough to reconstruct elapsed fight time safely across all eligible eras/promotions. Therefore F00 `0.1.1-draft` does **not** materialize any concept that requires elapsed fight/round time, directly or through an upstream feature.\n\nIn particular, FEATURES must not assume that every historical nonterminal round lasted 300 seconds/five minutes, must not infer round length from `scheduled_rounds`, and must not derive total elapsed fight time from `finish_round`/`finish_time_sec` until a versioned DATA/feature contract proves the relevant historical round-length semantics. `control_sec` is an observed general-control numerator; it is not elapsed fight time or ground time.\n\nThe catalog's `elapsed_exposure_policy` is the machine-readable gate. Under canonical v0 its `allowed_sources` list is empty. A time-normalized concept may move to a materializable status only after a versioned contract names an allowed canonical elapsed-exposure source and the concept declares explicit eligibility/provenance with `contract_safe=true`. The validator fails closed otherwise.\n\nAccordingly, the following kinds of exposure remain **currently materializable** where their canonical observations exist:\n\n- attempted events for conversion/accuracy/defense probabilities;\n- landed/absorbed events for explicitly named efficiency proxies;\n- compatible event totals for compositional shares;\n- eligible prior fights for historical result/method rates;\n- observed opportunities only where canonical DATA actually supplies an opportunity count.\n\nElapsed-time normalization remains a **reserved future exposure type**, not a canonical-v0 V1 denominator. This defers strike flow/pace, KD-per-time, TD-pressure-per-time, control share of fight time, submission/reversal activity per time, their time-dependent matchup interactions, four V2 time residuals, and time-intensity/persistence simulator concepts. It does not block attempt-conditioned quantities such as significant-strike accuracy, takedown conversion/defense, KD-per-landed-strike proxies, target/environment composition, or fight-count method history.\n\nMissing fields never borrow generic full-fight exposure and never become zero.\n\n'''
          doc = re.sub(r"## 7\. Rates, denominators, and exposure\n.*?(?=## 8\.)", section7, doc, flags=re.S)
          doc = doc.replace(
              "- event/time rates: 15 equivalent eligible minutes;",
              "- event/time rates: 15 equivalent eligible minutes is a **reserved future** shrinkage policy and is not materializable under canonical v0;",
          )
          doc = doc.replace(
              "Planned V2 families include significant-strike creation above expectation, strike suppression above expectation, takedown creation above expectation, control creation above expectation, and submission-attempt creation above expectation.",
              "Under canonical v0, only attempt-denominated `oa_takedown_creation` remains `V2_OPPONENT_ADJUSTED`. Significant-strike creation/suppression, control creation, and submission-attempt creation residuals are `DEFERRED` because their expected/actual residuals require the same unsafe elapsed-time exposure. Their chronology/sign semantics remain documented for a future contract-safe exposure source.",
          )
          doc = doc.replace(
              "Aggregate canonical observations can later support component models for:\n\n- strike-event intensity;\n- knockdown-hazard proxy;\n- takedown-attempt intensity;\n- takedown success conditional on attempt;\n- submission-attempt intensity;\n- round/time persistence effects.",
              "Under canonical v0, `sim_takedown_success_probability` remains the only currently active simulator-component concept because its denominator is observed takedown attempts. Strike-event intensity, KD interval hazard, takedown-attempt intensity, submission-attempt intensity, and round/time persistence concepts are `DEFERRED` until elapsed exposure becomes contract-safe. The concepts remain documented so a future DATA migration can promote them without redefining their intent.",
          )
          doc = doc.replace(
              "F00 does not derive global total elapsed fight duration across all eras/promotions because canonical v0 does not expose a bout-level round-length/rule-set field sufficient to make one formula safe everywhere. That concept is `DEFERRED`.",
              "F00 does not derive global total elapsed fight duration across all eras/promotions because canonical v0 does not expose a bout-level round-length/rule-set field sufficient to make one formula safe everywhere. `historical_fight_duration` and every feature that depends on unproven elapsed fight/round exposure are therefore `DEFERRED` together; this is enforced by `elapsed_exposure_policy` rather than left to F01 implementation judgment.",
          )
          review_marker = "## 19. F00 outputs and future materializer contract"
          if "Elapsed-exposure contradiction caught at merge gate" not in doc:
              addition = "16. **Elapsed-exposure contradiction caught at merge gate.** The initial draft deferred historical total fight duration while still marking multiple per-minute/per-second features materializable. Master review correctly identified that `fighter_round_stats` has no elapsed-round field and that F01 would otherwise need an unstated standard-round assumption. F00 now defers the full time-dependent feature chain, adds an explicit canonical-v0 exposure gate, and validates that no time-denominator concept can become materializable without an allowed source plus eligibility/provenance proof.\n"
              pos = doc.find(review_marker)
              if pos == -1:
                  raise SystemExit("FEATURE_CONTRACT self-review insertion marker missing")
              before = doc[:pos]
              after = doc[pos:]
              before = before.rstrip() + "\n" + addition + "\n"
              doc = before + after
          doc_path.write_text(doc, encoding="utf-8")

          readme_path = Path("features/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace("Feature contract version: `0.1.0-draft`.", f"Feature contract version: `{VERSION}`.")
          rule = "- Canonical v0 has no general contract-safe elapsed-round exposure source: time-normalized features and their dependent interactions/components remain `DEFERRED`; no 300-second/five-minute historical round assumption is permitted.\n"
          anchor_rule = "- Every rate declares numerator/denominator semantics and zero/missing behavior.\n"
          if rule not in readme:
              readme = readme.replace(anchor_rule, anchor_rule + rule)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Validate remediated contract before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m ufc_edge.features.contract
          python -m unittest discover -s tests/features -p 'test_*.py' -v
          git diff --check

      - name: Commit remediation to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/FEATURE_CONTRACT.md features/README.md features/feature_catalog.yaml features/feature_schema.json src/ufc_edge/features/contract.py tests/features/test_feature_contract.py
          git commit -m 'fix: gate unsafe elapsed-time feature exposure'
          git push origin HEAD:feat/feature-contract-f00
