name: Migrate weigh-in contract observation grain

on:
  push:
    branches: [main]
    paths:
      - "pipelines/migrate_weigh_in_contract_observation_grain.py"
      - ".github/workflows/migrate-weigh-in-contract-observation-grain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply migration and validate contract
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/weigh_in_contract_migration_${GITHUB_RUN_ID}.log"
          set +e
          {
            python pipelines/migrate_weigh_in_contract_observation_grain.py
            migration_code=$?
            if [ "$migration_code" -eq 0 ]; then
              python pipelines/validate_canonical_contract.py
              validation_code=$?
            else
              validation_code=99
            fi
            echo "migration_code=${migration_code} validation_code=${validation_code}"
            if [ "$migration_code" -ne 0 ]; then exit "$migration_code"; fi
            exit "$validation_code"
          } >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "migration": "weigh_in_contract_observation_grain",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/weigh_in_contract_migration_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/weigh_in_contract_migration_latest.json
          if [ "$code" -eq 0 ]; then git add schemas/canonical_data_contract_v0.json schemas/canonical_data_contract_v0.md; fi
          git commit -m "Migrate weigh-in contract observation grain (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
