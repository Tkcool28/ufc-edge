name: Audit official UFC fight event/date bridge

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_ufc_fight_event_bridge.py"
      - ".github/workflows/audit-ufc-fight-event-bridge.yml"
      - "data/raw/ufc_com_resources/events/**"
      - "data/raw/ufc_com_resources/fights/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit official fight event/date bridge
        run: python pipelines/audit_ufc_fight_event_bridge.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            provenance/audits/ufc_fight_event_bridge_latest.json \
            provenance/audits/ufc_fight_event_bridge_latest.md \
            data/derived/identity/ufc_fight_event_bridge_candidate.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit official UFC fight event/date bridge [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
