name: Audit duplicate UFC fight nodes by FightMetric ID

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_ufc_fightmetric_duplicate_nodes.py"
      - ".github/workflows/audit-ufc-fightmetric-duplicate-nodes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/audit_ufc_fightmetric_duplicate_nodes.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/audits/ufc_fightmetric_duplicate_nodes_latest.json provenance/audits/ufc_fightmetric_duplicate_nodes_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit duplicate UFC FightMetric fight nodes [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
