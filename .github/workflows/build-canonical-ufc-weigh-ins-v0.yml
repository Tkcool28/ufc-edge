name: Build and validate canonical UFC weigh-ins v0

# Registered on main; trigger version 1.
on:
  push:
    branches: [main]
    paths:
      - "pipelines/build_canonical_ufc_weigh_ins_v0.py"
      - "pipelines/build_ufc_weigh_in_canonical_candidate_v2.py"
      - "data/derived/identity/ufc_weigh_in_canonical_candidate_v2.csv"
      - "schemas/canonical_data_contract_v0.json"
      - ".github/workflows/build-canonical-ufc-weigh-ins-v0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, validate, and commit atomically
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p provenance/runs provenance/audits data/derived/qa data/canonical/v0

          # Extend the canonical validator to cover weigh_ins. The patch is exact and idempotent.
          python - <<'PY'
          from pathlib import Path
          p = Path("pipelines/validate_canonical_data_v0.py")
          text = p.read_text(encoding="utf-8")

          old = '    "field_provenance": "field_provenance.csv",\n}'
          new = '    "field_provenance": "field_provenance.csv",\n    "weigh_ins": "weigh_ins.csv",\n}'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("TABLE_FILES weigh_ins patch target not found")

          marker = '    for row in tables["fighter_round_stats"]:\n'
          insert = '''    for row in tables["weigh_ins"]:
              validate_uuid(row["weigh_in_observation_id"], "weigh_ins")
              fight = fight_by_id.get(row["fight_id"])
              if not fight:
                  fail(f"weigh-in references missing fight {row['fight_id']}")
              if row["fighter_id"] not in {fight["fighter_a_id"], fight["fighter_b_id"]}:
                  fail(f"weigh-in {row['weigh_in_observation_id']} references nonparticipant fighter")

          '''
          if insert not in text:
              if marker not in text:
                  raise SystemExit("weigh_ins FK validation patch target not found")
              text = text.replace(marker, insert + marker, 1)

          old_manifest = 'for name in ("fighters", "fights", "fighter_round_stats", "fighter_round_position"):'
          new_manifest = 'for name in ("fighters", "fights", "fighter_round_stats", "fighter_round_position", "field_provenance", "weigh_ins"):'
          if old_manifest in text:
              text = text.replace(old_manifest, new_manifest, 1)
          elif new_manifest not in text:
              raise SystemExit("manifest count patch target not found")

          old_print = 'f"position_rows={len(tables[\"fighter_round_position\"])} "'
          new_print = 'f"position_rows={len(tables[\"fighter_round_position\"])} weigh_ins={len(tables[\"weigh_ins\"])} "'
          if old_print in text:
              text = text.replace(old_print, new_print, 1)
          elif new_print not in text:
              raise SystemExit("validator summary patch target not found")

          p.write_text(text, encoding="utf-8")
          PY

          log="provenance/runs/canonical_ufc_weigh_ins_v0_${GITHUB_RUN_ID}.log"
          set +e
          {
            python pipelines/validate_canonical_contract.py &&
            python pipelines/validate_source_field_map.py &&
            python pipelines/validate_source_precedence.py &&
            python pipelines/build_ufc_weigh_in_canonical_candidate_v2.py &&
            python pipelines/build_canonical_ufc_weigh_ins_v0.py &&
            python pipelines/validate_canonical_data_v0.py
          } >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "build": "canonical_ufc_weigh_ins_v0",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/canonical_ufc_weigh_ins_v0_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write("\n")
          PY

          if [ "$code" -ne 0 ]; then
            for p in \
              pipelines/validate_canonical_data_v0.py \
              data/canonical/v0/weigh_ins.csv data/canonical/v0/field_provenance.csv \
              data/canonical/v0/manifest.json data/derived/qa/canonical_ufc_weigh_in_exclusions_v0.csv \
              provenance/audits/canonical_ufc_weigh_ins_v0_latest.json \
              provenance/audits/canonical_ufc_weigh_ins_v0_latest.md; do
              if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                git restore --worktree -- "$p"
              else
                rm -f "$p"
              fi
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/canonical_ufc_weigh_ins_v0_latest.json
          if [ "$code" -eq 0 ]; then
            git add pipelines/validate_canonical_data_v0.py \
              data/canonical/v0/weigh_ins.csv data/canonical/v0/field_provenance.csv data/canonical/v0/manifest.json \
              data/derived/qa/canonical_ufc_weigh_in_exclusions_v0.csv \
              provenance/audits/canonical_ufc_weigh_ins_v0_latest.json \
              provenance/audits/canonical_ufc_weigh_ins_v0_latest.md
          fi
          git commit -m "Build canonical UFC weigh-ins v0 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
