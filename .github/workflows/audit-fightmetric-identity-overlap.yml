name: Audit official UFC FightMetric identity overlap

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_fightmetric_identity_overlap.py"
      - ".github/workflows/audit-fightmetric-identity-overlap.yml"
      - "data/raw/ufc_com_resources/fights/**"
      - "data/raw/ufc_fightmetric_official/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit direct identity bridge
        run: python pipelines/audit_fightmetric_identity_overlap.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            provenance/audits/fightmetric_identity_overlap_latest.json \
            provenance/audits/fightmetric_identity_overlap_latest.md \
            data/derived/identity/ufc_fightmetric_fight_crosswalk_candidate.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Audit official UFC FightMetric identity overlap [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
