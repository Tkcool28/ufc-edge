name: MOV0 Confidence Terrain Feature Behavior Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mov0-confidence-terrain-feature-behavior-v1.yml"
      - "tools/diagnostics/run_mov0_confidence_terrain_feature_behavior_v1.py"
      - "models/mov0/diagnostics/confidence_terrain_feature_behavior_v1/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact frozen MOV0 dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0 scikit-learn==1.5.2

      - name: Verify merged PR 111 ancestry
        run: git merge-base --is-ancestor 15d4beb4470098343b242d54e52c5970b49f4237 HEAD

      - name: Download authoritative frozen MOV0 artifact
        uses: actions/download-artifact@v4
        with:
          name: mov0-standard-finish-probability-v1
          path: ${{ runner.temp }}/mov0
          repository: Tkcool28/ufc-edge
          run-id: 35376956316
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen corrected F02 artifact
        uses: actions/download-artifact@v4
        with:
          name: physical-profile-corrected-f02-v1
          path: ${{ runner.temp }}/f02
          repository: Tkcool28/ufc-edge
          run-id: 35182939981
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run authorized coefficient recovery and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python tools/diagnostics/run_mov0_confidence_terrain_feature_behavior_v1.py \
            --f02-dir "${{ runner.temp }}/f02" \
            --mov0-run-dir "${{ runner.temp }}/mov0/ufc-edge/ufc-edge/models/mov0/run_v1" \
            --canonical-fights data/canonical/v0/fights.csv \
            --terrain-assignment governance/model_validation_bucket_v1/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv.gz \
            --feature-contract models/mov0/feature_surface_v1.json \
            --output-dir "${{ runner.temp }}/diagnostic"

      - name: Upload diagnostic evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov0-confidence-terrain-feature-behavior-v1
          path: ${{ runner.temp }}/diagnostic
          if-no-files-found: error
          retention-days: 30
