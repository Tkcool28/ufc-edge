name: Probe MMA Decisions UFC coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mmadecisions-ufc.yml"
      - "pipelines/probe_mmadecisions_ufc_coverage.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/probe_mmadecisions_ufc_coverage.py
      - name: Commit coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          git add provenance/mmadecisions_ufc_coverage_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record MMA Decisions UFC coverage probe [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
