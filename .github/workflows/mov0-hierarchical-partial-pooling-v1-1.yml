name: MOV0 Hierarchical Inference Budget Amendment V1.1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mov0-hierarchical-partial-pooling-v1-1.yml'
      - 'models/challengers/**'
      - 'tools/models/*mov0_hierarchical*.py'
      - 'tests/models/test_mov0_hierarchical_v1_1.py'
permissions:
  contents: read
jobs:
  specification-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/challengers/mov0_hierarchical_v1/requirements.lock
      - run: git merge-base --is-ancestor 30b14dc5b355e9356dbdd80c793ab6d6feedf861 HEAD
      - run: python -m pytest -q tests/models/test_mov0_hierarchical_v1_1.py tests/models/test_mov0.py tests/models/test_mov0_contract.py
      - run: git diff origin/main...HEAD --check
