name: Snapshot official UFC FightMetric rich stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-ufc-fightmetric.yml"
      - "pipelines/ingest_ufc_fight_stat.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-ufc-fightmetric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot official UFC FightMetric resources
        run: python pipelines/ingest_ufc_fight_stat.py
      - name: Commit immutable raw snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add data/raw/ufc_fightmetric_official
          if git diff --cached --quiet; then
            echo "No UFC FightMetric snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot official UFC FightMetric rich stats [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
