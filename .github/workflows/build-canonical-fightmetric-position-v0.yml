name: Build canonical FightMetric position v0

on:
  push:
    branches: [main]
    paths:
      - "pipelines/build_canonical_fightmetric_position_v0.py"
      - ".github/workflows/build-canonical-fightmetric-position-v0.yml"
      - "schemas/canonical_data_contract_v0.json"
      - "data/derived/identity/ufc_greco_fight_alignment_candidate.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with durable diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs provenance/audits data/derived/qa data/canonical/v0
          log="provenance/runs/canonical_fightmetric_position_v0_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/build_canonical_fightmetric_position_v0.py >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "build": "canonical_fightmetric_position_v0",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/canonical_fightmetric_position_v0_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/canonical_fightmetric_position_v0_latest.json
          for p in \
            data/canonical/v0/fighter_round_position.csv \
            data/canonical/v0/manifest.json \
            data/derived/qa/canonical_fightmetric_position_exclusions_v0.csv \
            provenance/audits/canonical_fightmetric_position_v0_latest.json \
            provenance/audits/canonical_fightmetric_position_v0_latest.md; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          git commit -m "Build canonical FightMetric position v0 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
