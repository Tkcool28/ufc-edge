name: UFCStats Live Physical Recovery V1

on:
  pull_request:
    branches: [main]
    paths:
      - "pipelines/fetch_ufcstats_live_physical_recovery_v1.py"
      - "data/supplemental/ufcstats_live_recovery_targets_v1.csv"
      - ".github/workflows/ufcstats-live-physical-recovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch bounded live UFCStats cohort
        run: python pipelines/fetch_ufcstats_live_physical_recovery_v1.py --snapshot-id "$"+"{GITHUB_RUN_ID}"
      - name: Upload raw live recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ufcstats-live-physical-recovery-v1
          path: data/raw/ufcstats_live_recovery/
          if-no-files-found: error
          retention-days: 30
