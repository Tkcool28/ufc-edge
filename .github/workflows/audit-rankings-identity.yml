name: Audit historical UFC rankings identity

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_rankings_identity.py"
      - ".github/workflows/audit-rankings-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run and commit audit
        shell: bash
        run: |
          set -euo pipefail
          python pipelines/audit_rankings_identity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/audits/rankings_identity_latest.json data/derived/identity/rankings_greco_name_crosswalk_candidate.csv
          git commit -m "Audit historical UFC rankings identity [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
