name: PR70 Freeze Percentile Reference TEMP

on:
  push:
    branches: [feat/model-validation-bucket-contract-v1]

permissions:
  contents: write
  actions: read

jobs:
  freeze-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-validation-bucket-contract-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop if governed reference is already exact
        id: existing
        run: |
          PATH_REF=governance/model_validation_bucket_v1/MODEL_VALIDATION_PERCENTILE_REFERENCE_V1.json
          if test -f "$PATH_REF" && test "$(sha256sum "$PATH_REF" | awk '{print $1}')" = "c5a54e23e61c5b59f6e7c44c4de2c19652bdd664733001b126cddd41d66f89aa"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.existing.outputs.ready != 'true'
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0
      - name: Download pinned corrected F02
        if: steps.existing.outputs.ready != 'true'
        uses: actions/download-artifact@v4
        with:
          name: physical-profile-corrected-f02-v1
          path: ${{ runner.temp }}/corrected-f02
          repository: Tkcool28/ufc-edge
          run-id: 35182939981
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact frozen V1 percentile reference
        if: steps.existing.outputs.ready != 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd

          features = [
              "fs__knockdown_rate__created_per_15__career__shrunk",
              "fs__sig_strike_flow__landed_per_min__career__shrunk",
              "fs__submission_attempt_rate__created_per_15__career__shrunk",
              "fs__takedown_pressure__created_per_15__career__shrunk",
          ]
          f02 = Path(os.environ["RUNNER_TEMP"]) / "corrected-f02"
          cols = ["promotion", "event_date"] + [f"f{s}__{f}" for s in (1, 2) for f in features]
          df = pd.read_parquet(f02 / "winner_modeling_table.parquet", columns=cols)
          df["event_date"] = pd.to_datetime(df.event_date, errors="raise")
          df = df[df.promotion.eq("UFC") & df.event_date.dt.year.between(2015, 2026)].copy()
          payload = {
              "version": "MODEL_VALIDATION_PERCENTILE_REFERENCE_V1",
              "contract_version": "MODEL_VALIDATION_BUCKET_CONTRACT_V1",
              "source_f02_logical_sha256": "2d1a367416e105ed6fe546eb8590ae7b555dd044304ad0ba40c7945420599ba0",
              "source_f02_table_sha256": "d8a82dc7baf3d6e85c987e7fbfc63bb6329d59407cd8a66e5f228e0012e6b580",
              "generation_method_identity": "POOLED_UFC_2015_2026_FIGHTER_SIDE_MIDRANK_RLE_V1",
              "generation_method": "Pool non-null fighter-side corrected-F02 values over UFC fights dated 2015-2026, sort exact float64 values ascending, run-length encode [value,count], and score with mid-rank empirical percentile (count_lt + 0.5*count_eq)/N.",
              "features": {},
          }
          for feature in features:
              values = pd.concat([
                  pd.to_numeric(df[f"f1__{feature}"], errors="coerce"),
                  pd.to_numeric(df[f"f2__{feature}"], errors="coerce"),
              ], ignore_index=True).dropna().to_numpy(dtype=float)
              values = np.sort(values)
              unique, counts = np.unique(values, return_counts=True)
              payload["features"][feature] = {
                  "observed": int(values.size),
                  "run_length_values": [[float(v), int(c)] for v, c in zip(unique, counts)],
              }
          path = Path("governance/model_validation_bucket_v1/MODEL_VALIDATION_PERCENTILE_REFERENCE_V1.json")
          raw = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
          path.write_bytes(raw)
          actual = hashlib.sha256(raw).hexdigest()
          expected = "c5a54e23e61c5b59f6e7c44c4de2c19652bdd664733001b126cddd41d66f89aa"
          if actual != expected:
              raise SystemExit(f"reference hash mismatch: {actual}")
          print(actual)
          PY
      - name: Commit governed reference
        if: steps.existing.outputs.ready != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/model_validation_bucket_v1/MODEL_VALIDATION_PERCENTILE_REFERENCE_V1.json
          git commit -m "fix(pr70): freeze V1 percentile reference"
          git push origin HEAD:feat/model-validation-bucket-contract-v1
