name: Audit Feature Family A striking coverage v0
on:
  push:
    branches: [main]
    paths:
      - "features/v0/striking_environment.csv"
      - "features/v0/striking_environment_manifest.json"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit temporal coverage and commit
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p provenance/runs provenance/audits features/v0
          log="provenance/runs/striking_environment_coverage_v0_${GITHUB_RUN_ID}.log"
          set +e
          python features/audit_striking_environment_coverage_v0.py >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          code,log=int(sys.argv[1]),sys.argv[2]
          p={"schema_version":1,"audit":"striking_environment_coverage_v0","status":"success" if code==0 else "failed","exit_code":code,"github_run_id":os.environ.get("GITHUB_RUN_ID"),"trigger_sha":os.environ.get("GITHUB_SHA"),"completed_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),"log":log}
          open("provenance/runs/striking_environment_coverage_v0_latest.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/striking_environment_coverage_v0_latest.json
          if [ "$code" -eq 0 ]; then
            git add features/v0/striking_environment_coverage_by_year.csv provenance/audits/striking_environment_coverage_v0_latest.json
          fi
          git commit -m "Audit striking environment coverage v0 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
