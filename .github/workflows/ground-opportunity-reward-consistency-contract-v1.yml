name: Ground opportunity reward consistency contract V1
on:
  pull_request:
    paths:
      - 'docs/model_contracts/ground_opportunity_reward_consistency_v1/**'
      - '.github/workflows/ground-opportunity-reward-consistency-contract-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic mathematics
        run: pip install -r docs/model_contracts/ground_opportunity_reward_consistency_v1/requirements.txt
      - name: Verify frozen evidence before execution
        run: python docs/model_contracts/ground_opportunity_reward_consistency_v1/verify.py
      - name: Synthetic conservation and feasibility only
        run: python docs/model_contracts/ground_opportunity_reward_consistency_v1/test_contract.py
      - name: Regenerate synthetic fixtures and documents
        run: |
          python docs/model_contracts/ground_opportunity_reward_consistency_v1/save_synthetic_records.py --check
          python docs/model_contracts/ground_opportunity_reward_consistency_v1/write_contract.py
      - name: Verify regenerated evidence
        run: |
          python docs/model_contracts/ground_opportunity_reward_consistency_v1/verify.py
          git diff --exit-code
