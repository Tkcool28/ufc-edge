name: M0 population inspection

on:
  push:
    branches: [feat/m0-empirical-winner-baseline-v1]
    paths:
      - '.github/workflows/m0-population-inspect.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0 pandas==2.2.3
      - name: Download frozen F02 artifact
        uses: actions/download-artifact@v4
        with:
          name: f02-predictor-replay-v1
          path: ${{ runner.temp }}/f02
          repository: Tkcool28/ufc-edge
          run-id: 34673108776
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect UFC binary population and candidate coverage
        env:
          F02: ${{ runner.temp }}/f02/winner_modeling_table.parquet
        run: |
          python - <<'PY'
          import json, os
          import pandas as pd
          df=pd.read_parquet(os.environ['F02'])
          df['event_date']=pd.to_datetime(df['event_date'])
          u=df[(df['promotion']=='UFC') & (df['binary_winner_eligible']==True)].copy()
          candidate=[
            'f1__fs__prior_fight_count__career__raw','f2__fs__prior_fight_count__career__raw',
            'f1__ctx__age_at_fight','f2__ctx__age_at_fight',
            'f1__ctx__layoff_days','f2__ctx__layoff_days',
            'f1__fs__sig_strike_efficiency__accuracy__career__shrunk',
            'f1__fs__sig_strike_efficiency__defense__career__shrunk',
            'f2__fs__sig_strike_efficiency__accuracy__career__shrunk',
            'f2__fs__sig_strike_efficiency__defense__career__shrunk',
            'f1__fs__takedown_conversion__success__career__shrunk',
            'f1__fs__takedown_conversion__defense__career__shrunk',
            'f2__fs__takedown_conversion__success__career__shrunk',
            'f2__fs__takedown_conversion__defense__career__shrunk',
            'mx__reach_difference_cm','scheduled_rounds','ctx__title_bout','ctx__weight_class'
          ]
          payload={
            'ufc_binary_total':int(len(u)),
            'fighter_1_win_rate':float(u['fighter_1_win'].mean()),
            'by_year':{str(k):int(v) for k,v in u.groupby(u['event_date'].dt.year).size().items()},
            'candidate_non_null_pct':{c:float(u[c].notna().mean()) for c in candidate},
            'candidate_non_null_pct_from_2010':{c:float(u.loc[u['event_date'].dt.year>=2010,c].notna().mean()) for c in candidate},
            'rows_from_2005':int((u['event_date'].dt.year>=2005).sum()),
            'rows_from_2010':int((u['event_date'].dt.year>=2010).sum()),
            'rows_from_2012':int((u['event_date'].dt.year>=2012).sum()),
            'rows_from_2015':int((u['event_date'].dt.year>=2015).sum())
          }
          print('M0_POPULATION_INSPECTION='+json.dumps(payload,sort_keys=True))
          PY
