name: Correct audited Greco round mapping semantics

on:
  push:
    branches: [main]
    paths:
      - "pipelines/correct_greco_round_mapping_semantics.py"
      - ".github/workflows/correct-greco-round-mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/correct_greco_round_mapping_semantics.py
      - run: python pipelines/audit_source_surfaces.py
      - run: python pipelines/validate_canonical_contract.py
      - run: python pipelines/validate_source_field_map.py
      - name: Commit corrected registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/source_field_map_v0.json provenance/audits/source_surface_inventory.json provenance/audits/source_surface_inventory.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Greco one-fighter-per-round source mappings [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
