name: Build Feature Family A striking environment v0
on:
  push:
    branches: [main]
    paths:
      - "features/family_a_striking_v0.json"
      - "features/build_striking_environment_v0.py"
      - "features/validate_striking_environment_v0.py"
      - "features/v0/fighter_state_primitives.csv"
      - "features/v0/manifest.json"
      - ".github/workflows/build-striking-environment-v0.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build twice, validate, and commit deterministic outputs
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p provenance/runs provenance/audits features/v0
          log="provenance/runs/striking_environment_v0_${GITHUB_RUN_ID}.log"
          set +e
          {
            python -m py_compile features/build_striking_environment_v0.py features/validate_striking_environment_v0.py
            echo '=== BUILD 1 ==='
            python features/build_striking_environment_v0.py
            python features/validate_striking_environment_v0.py
            sha256sum features/v0/striking_environment.csv > /tmp/striking_hash_1
            echo '=== BUILD 2 DETERMINISM CHECK ==='
            python features/build_striking_environment_v0.py
            python features/validate_striking_environment_v0.py
            sha256sum features/v0/striking_environment.csv > /tmp/striking_hash_2
            diff -u /tmp/striking_hash_1 /tmp/striking_hash_2
            cat /tmp/striking_hash_2
          } >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          code,log=int(sys.argv[1]),sys.argv[2]
          p={"schema_version":1,"build":"striking_environment_v0","status":"success" if code==0 else "failed","exit_code":code,"github_run_id":os.environ.get("GITHUB_RUN_ID"),"trigger_sha":os.environ.get("GITHUB_SHA"),"completed_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),"log":log,"determinism_check":"pass" if code==0 else "not_passed"}
          open("provenance/runs/striking_environment_v0_latest.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/striking_environment_v0_latest.json
          if [ "$code" -eq 0 ]; then
            git add features/v0/striking_environment.csv features/v0/striking_environment_manifest.json provenance/audits/striking_environment_v0_latest.json provenance/audits/striking_environment_v0_latest.md
          fi
          git commit -m "Build striking environment v0 (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
