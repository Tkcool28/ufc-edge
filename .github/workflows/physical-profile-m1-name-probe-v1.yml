# Registered follow-up probe for the stacked diagnostic PR.
name: Physical Profile M1 Name Probe V1

on:
  pull_request:
    branches: [feat/physical-profile-corrected-m1-rerun-v1]
    paths:
      - "tools/models/probe_early_reach_known_fighters_v1.py"
      - ".github/workflows/physical-profile-m1-name-probe-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0
      - name: Compile probe
        run: python -m py_compile tools/models/probe_early_reach_known_fighters_v1.py
      - name: Download old F02
        uses: actions/download-artifact@v4
        with:
          name: f02-predictor-replay-v1
          path: ${{ runner.temp }}/f02-old
          repository: Tkcool28/ufc-edge
          run-id: 34673108776
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download corrected F02
        uses: actions/download-artifact@v4
        with:
          name: physical-profile-corrected-f02-v1
          path: ${{ runner.temp }}/f02-new
          repository: Tkcool28/ufc-edge
          run-id: 35177629733
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fighter-name probe
        run: |
          python tools/models/probe_early_reach_known_fighters_v1.py \
            --old-f02-dir "${{ runner.temp }}/f02-old" \
            --new-f02-dir "${{ runner.temp }}/f02-new" \
            --feature-surface models/m1/feature_surface_v1.json \
            --fighters-csv data/canonical/v0/fighters.csv \
            --output-dir "${{ runner.temp }}/name-probe"
      - name: Publish summary
        run: cat "${{ runner.temp }}/name-probe/early_reach_known_probe.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: physical-profile-m1-name-probe-v1
          path: ${{ runner.temp }}/name-probe
          if-no-files-found: error
          retention-days: 30
