name: F01 Review Remediation

on:
  push:
    branches: [feat/v1-pit-fighter-state-f01]
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'feat/v1-pit-fighter-state-f01')
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-pit-fighter-state-f01
          fetch-depth: 0

      - name: Apply reviewed chronology and fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/features/test_v1_materializer.py')
          text = path.read_text(encoding='utf-8')
          old = '''        rows = [
            fight("f5", "2024-05-01"),
            fight("f4a", "2024-04-01"),
            fight("f4b", "2024-04-01"),
            fight("f3", "2024-03-01"),
        ]
'''
          new = '''        rows = [
            fight("f5", "2024-05-01"),
            fight("f4", "2024-04-01"),
            fight("f3a", "2024-03-01"),
            fight("f3b", "2024-03-01"),
        ]
'''
          if old not in text:
              raise SystemExit('same-date ambiguity fixture anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('src/ufc_edge/features/history.py')
          text = path.read_text(encoding='utf-8')
          old = '''        def key(row: dict[str, str]) -> tuple[date, str, int]:
            fight = self.require_fight(row["fight_id"])
            attempt = as_int(row.get("attempt_number")) or 0
            return (fight.event_date, row.get("weigh_in_observation_id", ""), attempt)
'''
          new = '''        def key(row: dict[str, str]) -> tuple[date, date, int, str]:
            fight = self.require_fight(row["fight_id"])
            weigh_in_date = parse_date(row["weigh_in_date"]) if _blank_to_none(row.get("weigh_in_date")) else fight.event_date
            attempt = as_int(row.get("attempt_number")) or 0
            return (fight.event_date, weigh_in_date, attempt, row.get("weigh_in_observation_id", ""))
'''
          if old not in text:
              raise SystemExit('prior-scale ordering anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('src/ufc_edge/features/state.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    latest_date = max(f.event_date for f in prior_fights)
                    latest = sorted(f.fight_id for f in prior_fights if f.event_date == latest_date)
                    if len(latest) > 1:
                        value, state, reason, lineage = None, "missing_observation", "most-recent prior fight date is tied; chronology unresolved", tuple(latest)
                    else:
                        target_date = self.store.require_fight(target_fight_id).event_date if target_fight_id else parse_cutoff(cutoff).date()
                        value = (target_date - latest_date).days
                        state, reason, lineage = "observed_positive", None, tuple(latest)
'''
          new = '''                    latest_date = max(f.event_date for f in prior_fights)
                    latest = sorted(f.fight_id for f in prior_fights if f.event_date == latest_date)
                    target_date = self.store.require_fight(target_fight_id).event_date if target_fight_id else parse_cutoff(cutoff).date()
                    value = (target_date - latest_date).days
                    state, reason, lineage = "observed_positive", None, tuple(latest)
'''
          if old not in text:
              raise SystemExit('layoff chronology anchor missing')
          text = text.replace(old, new)

          old = '                    if None in {a_creation, a_vuln, b_creation, b_vuln}:\n'
          new = '                    if any(item is None for item in (a_creation, a_vuln, b_creation, b_vuln)):\n'
          if old not in text:
              raise SystemExit('matchup dependency anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate and commit remediation
        shell: bash
        run: |
          set -euo pipefail
          python -m ufc_edge.features.contract
          python -m unittest discover -s tests/features -p 'test_feature_contract.py' -v
          python -m unittest discover -s tests/features -p 'test_v1_materializer.py' -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ufc_edge/features/history.py src/ufc_edge/features/state.py tests/features/test_v1_materializer.py
          git commit -m 'fix(features): tighten F01 chronology semantics'
          git push origin HEAD:feat/v1-pit-fighter-state-f01
