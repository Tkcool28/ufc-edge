name: Audit official UFC FightMetric era coverage

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_fightmetric_era_coverage.py"
      - ".github/workflows/audit-fightmetric-era-coverage.yml"
      - "data/derived/identity/ufc_fightmetric_fight_crosswalk_candidate.csv"
      - "data/derived/identity/ufc_fight_event_bridge_candidate.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/audit_fightmetric_era_coverage.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/audits/fightmetric_era_coverage_latest.json provenance/audits/fightmetric_era_coverage_latest.md data/derived/coverage/fightmetric_coverage_by_year.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit official UFC FightMetric era coverage [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
