name: Snapshot free UFC.com resources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-ufc-com.yml"
      - "pipelines/ingest_ufc_com_resource.py"
      - "provenance/ufc_com_jsonapi_candidate.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-ufc-com-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out writable branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot and commit UFC.com resources independently
        shell: bash
        run: |
          set -u
          mkdir -p provenance/runs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sid="$(date -u +%Y%m%dT%H%M%SZ)"
          overall=0

          # Fights first because this is the critical FightMetric/identity bridge.
          for resource in fights events athletes; do
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            log="provenance/runs/ufc_com_${resource}_${GITHUB_RUN_ID}.log"
            status="provenance/runs/ufc_com_${resource}_${GITHUB_RUN_ID}.json"

            set +e
            UFC_EDGE_SNAPSHOT_ID="$sid" timeout --signal=TERM --kill-after=30s 2100s \
              python pipelines/ingest_ufc_com_resource.py --collection "$resource" >"$log" 2>&1
            code=$?
            set -e
            ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if [ "$code" -eq 0 ]; then
              result="success"
            elif [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              result="process_timeout"
              overall=1
            else
              result="failed"
              overall=1
            fi

            python - "$status" "$resource" "$sid" "$started" "$ended" "$result" "$code" "$log" <<'PY'
          import json, os, sys
          path, resource, sid, started, ended, result, code, log = sys.argv[1:]
          payload = {
              "pipeline": "ufc_com_resource",
              "resource": resource,
              "snapshot_id": sid,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "started_at_utc": started,
              "ended_at_utc": ended,
              "result": result,
              "exit_code": int(code),
              "process_timeout_seconds": 2100,
              "log_path": log,
              "promotion_rule": "Raw resource is committed only when manifest exists and process exits 0.",
          }
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

            git add "$status" "$log"
            if [ "$result" = "success" ] && [ -f "data/raw/ufc_com_resources/${resource}/${sid}/manifest.json" ]; then
              git add "data/raw/ufc_com_resources/${resource}/${sid}"
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Record UFC.com ${resource} run ${GITHUB_RUN_ID} (${result}) [skip ci]"
              git pull --rebase origin "${{ github.ref_name }}"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
          done

          exit "$overall"
