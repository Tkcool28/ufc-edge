name: Apply audited source semantics

on:
  push:
    branches: [main]
    paths:
      - "pipelines/apply_audited_source_semantics.py"
      - ".github/workflows/apply-audited-source-semantics.yml"
      - "provenance/audits/fightmetric_position_time_quality_latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply, validate, and record result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/source_semantics_promotion_${GITHUB_RUN_ID}.log"
          set +e
          {
            python pipelines/apply_audited_source_semantics.py &&
            python pipelines/validate_canonical_contract.py &&
            python pipelines/validate_source_field_map.py
          } >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "audit": "source_semantics_promotion",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/source_semantics_promotion_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/source_semantics_promotion_latest.json
          if [ "$code" -eq 0 ]; then git add schemas/source_field_map_v0.json; fi
          git commit -m "Record source semantics promotion (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
