name: Apply audited source semantics

on:
  push:
    branches: [main]
    paths:
      - "pipelines/apply_audited_source_semantics.py"
      - ".github/workflows/apply-audited-source-semantics.yml"
      - "provenance/audits/fightmetric_position_time_quality_latest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply audited semantics
        run: python pipelines/apply_audited_source_semantics.py
      - name: Validate canonical contract and source map
        run: |
          python pipelines/validate_canonical_contract.py
          python pipelines/validate_source_field_map.py
      - name: Commit promoted registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/source_field_map_v0.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote audited FightMetric position bucket mappings [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
