name: Extract official UFC weigh-in candidate rows

on:
  push:
    branches: [main]
    paths:
      - "pipelines/extract_ufc_weigh_in_candidates.py"
      - ".github/workflows/extract-ufc-weigh-in-candidates.yml"
      - "data/raw/ufc_official_articles/20260821T210000Z/weigh_in/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and record result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/ufc_weigh_in_candidate_extraction_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/extract_ufc_weigh_in_candidates.py >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 1,
              "pipeline": "ufc_weigh_in_candidate_extraction",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
          }
          with open("provenance/runs/ufc_weigh_in_candidate_extraction_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_weigh_in_candidate_extraction_latest.json
          if [ "$code" -eq 0 ]; then
            git add data/derived/discovery/ufc_weigh_in_rows_candidate.csv provenance/audits/ufc_weigh_in_candidate_extraction_latest.json
          fi
          git commit -m "Extract UFC weigh-in candidate rows (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
