name: Model Validation Bucket Contract V1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/model-validation-bucket-contract-v1.yml"
      - ".github/workflows/f00-feature-contract.yml"
      - ".github/workflows/f01-v1-materializer.yml"
      - ".github/workflows/feature-governance-v1.yml"
      - "tools/validation/**"
      - "tools/features/check_repo_artifact_hygiene.py"
      - "tests/test_model_validation_bucket_contract_v1.py"
      - "tests/features/test_v1_repo_artifact_hygiene.py"
      - "governance/MODEL_VALIDATION_BUCKET_CONTRACT_V1.md"
      - "governance/model_validation_bucket_v1/**"

permissions:
  contents: read
  actions: read

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0 scikit-learn==1.5.2 pytest==8.3.5
      - name: Run validation terrain tests
        run: python -m pytest -q tests/test_model_validation_bucket_contract_v1.py
      - name: Download pinned corrected F02
        uses: actions/download-artifact@v4
        with:
          name: physical-profile-corrected-f02-v1
          path: ${{ runner.temp }}/corrected-f02
          repository: Tkcool28/ufc-edge
          run-id: 35182939981
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Stage-A terrain
        run: |
          python tools/validation/build_bucket_assignment_v1.py \
            --f02-dir "${{ runner.temp }}/corrected-f02" \
            --audit-marker governance/MOV_BUCKET_INPUT_TEMPORAL_SAFETY_AUDIT_V1_COMPLETE.json \
            --canonical-fights data/canonical/v0/fights.csv \
            --output-dir "${{ runner.temp }}/stage-a"
          gzip -n -c "${{ runner.temp }}/stage-a/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv" \
            > "${{ runner.temp }}/stage-a/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv.gz"
      - name: Prove deterministic Stage-A regeneration
        run: |
          python tools/validation/build_bucket_assignment_v1.py \
            --f02-dir "${{ runner.temp }}/corrected-f02" \
            --audit-marker governance/MOV_BUCKET_INPUT_TEMPORAL_SAFETY_AUDIT_V1_COMPLETE.json \
            --canonical-fights data/canonical/v0/fights.csv \
            --output-dir "${{ runner.temp }}/stage-a-repeat"
          cmp "${{ runner.temp }}/stage-a/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv" \
              "${{ runner.temp }}/stage-a-repeat/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv"
          cmp "${{ runner.temp }}/stage-a/MODEL_VALIDATION_BUCKET_CONTRACT_V1.json" \
              "${{ runner.temp }}/stage-a-repeat/MODEL_VALIDATION_BUCKET_CONTRACT_V1.json"
          cmp "${{ runner.temp }}/stage-a/threshold_selection_evidence_v1.json" \
              "${{ runner.temp }}/stage-a-repeat/threshold_selection_evidence_v1.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ["RUNNER_TEMP"]+"/stage-a/manifest.json").read_text())
          b=json.loads(Path(os.environ["RUNNER_TEMP"]+"/stage-a-repeat/manifest.json").read_text())
          for key in ("assignment_logical_sha256","assignment_physical_sha256","contract_sha256","threshold_evidence_sha256"):
              if a[key] != b[key]:
                  raise SystemExit(f"determinism failure: {key}")
          print("Stage-A deterministic regeneration verified")
          PY
      - name: Upload Stage-A freeze candidate
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-bucket-contract-v1-stage-a
          path: ${{ runner.temp }}/stage-a
          if-no-files-found: error
          retention-days: 30

  stage-b:
    needs: stage-a
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyarrow==17.0.0 scikit-learn==1.5.2
      - name: Download frozen Stage-A output
        uses: actions/download-artifact@v4
        with:
          name: model-validation-bucket-contract-v1-stage-a
          path: ${{ runner.temp }}/stage-a
      - name: Download pinned corrected M1 artifact
        uses: actions/download-artifact@v4
        with:
          name: physical-profile-corrected-m1-rerun-v1
          path: ${{ runner.temp }}/corrected-m1
          repository: Tkcool28/ufc-edge
          run-id: 35182939981
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate and verify corrected M1 OOF
        run: |
          OOF="$(find "${{ runner.temp }}/corrected-m1" -name m1_oof_predictions.parquet -print -quit)"
          test -n "$OOF" && test -s "$OOF"
          echo "M1_OOF=$OOF" >> "$GITHUB_ENV"
          test "$(sha256sum "$OOF" | awk '{print $1}')" = "5eaa09e82787cae0e3a198d31b0c19573557c94f0faf9302a582023c44a39b78"
      - name: Run Stage-B corrected-M1 diagnostic
        run: |
          python tools/validation/run_m1_calibration_diagnostic_v1.py \
            --assignment "${{ runner.temp }}/stage-a/MODEL_VALIDATION_BUCKET_ASSIGNMENTS_V1.csv" \
            --m1-oof "$M1_OOF" \
            --canonical-fights data/canonical/v0/fights.csv \
            --output-dir "${{ runner.temp }}/stage-b"
      - name: Upload Stage-B diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-bucket-contract-v1-stage-b
          path: ${{ runner.temp }}/stage-b
          if-no-files-found: error
          retention-days: 30
