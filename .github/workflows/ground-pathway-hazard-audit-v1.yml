name: Ground pathway hazard audit V1
on:
  pull_request:
    paths:
      - 'docs/model_diagnostics/ground_pathway_measurement_hazard_v1/**'
      - '.github/workflows/ground-pathway-hazard-audit-v1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r models/challengers/ground_pathway_simulator_poc_v1/requirements.txt matplotlib
      - name: Verify audit publication
        run: python docs/model_diagnostics/ground_pathway_measurement_hazard_v1/publication.py --verify
      - name: Restore immutable POC records
        run: python -c "import sys; sys.path.insert(0,'models/challengers/ground_pathway_simulator_poc_v1'); import publication; publication.restore(publication.OUT)"
      - name: Independent reward quadrature
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python docs/model_diagnostics/ground_pathway_measurement_hazard_v1/verify.py
      - name: Verify frozen source evidence
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python models/challengers/ground_pathway_simulator_poc_v1/publication.py --verify-isolated
