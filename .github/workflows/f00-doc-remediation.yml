name: F00 Exposure Summary Correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/feature-contract-f00'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/feature-contract-f00
          fetch-depth: 0

      - name: Correct architecture summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('features/FEATURE_CONTRACT.md')
          text = path.read_text(encoding='utf-8')
          review = '16. **Elapsed-exposure contradiction caught at merge gate.**'
          text = text.replace(review, '15. **Elapsed-exposure contradiction caught at merge gate.**')

          summary = 'After these corrections, fighter state and matchup interactions are separate; targets are isolated; predictive features are as-of; rates declare denominators; zero/missing are distinguishable; shrinkage/debutants are explicit; opponent adjustment is chronological; orientation is provider-neutral; external promotions are deliberate; coarse positional fields remain coarse; profiles/rankings are point-in-time; no core concept requires raw/provider layouts; variants are opt-in; and the repository remains understandable from this document plus the machine-readable contract files.\n15. **Elapsed-exposure contradiction caught at merge gate.**'
          reordered = '15. **Elapsed-exposure contradiction caught at merge gate.**'
          if summary in text:
              item_tail = text.split(reordered, 1)[1].split('\n\n## 19.', 1)[0]
              text = text.replace(summary + item_tail, reordered + item_tail + '\n\nAfter these corrections, fighter state and matchup interactions are separate; targets are isolated; predictive features are as-of; rates declare denominators; zero/missing are distinguishable; shrinkage/debutants are explicit; opponent adjustment is chronological; orientation is provider-neutral; external promotions are deliberate; coarse positional fields remain coarse; profiles/rankings are point-in-time; no core concept requires raw/provider layouts; variants are opt-in; and the repository remains understandable from this document plus the machine-readable contract files.')

          replacements = {
              '4. **How are rates normalized?** Explicit numerator/denominator/eligibility with no implicit denominator substitution.':
                  '4. **How are rates normalized?** Explicit numerator/denominator/eligibility with no implicit substitution; only denominators proven safe by the current DATA/feature contract are materializable.',
              '5. **How is exposure represented?** Elapsed seconds, attempts/opportunities, landed/absorbed events, or fight counts according to concept.':
                  '5. **How is exposure represented?** Under canonical v0, materializable exposure is attempts/opportunities, compatible event totals, landed/absorbed events, or eligible fight counts. Elapsed fight/round exposure is reserved and `DEFERRED` until a contract-safe source exists.',
              '11. **Which concepts are V1?** Foundational striking, wrestling/control/submission activity, durability/pace/history, context, and a small set of deterministic matchup interactions.':
                  '11. **Which concepts are V1?** Only concepts with contract-safe canonical-v0 denominators: attempt-conditioned striking/wrestling efficiencies, event compositions, method/durability history, context, and safe derived/matchup features. Time-normalized activity, pace, control-share, submission/reversal-rate concepts and their dependents are `DEFERRED`.',
              '12. **Which wait for V2?** Chronological opponent-adjusted creation/suppression families.':
                  '12. **Which wait for V2?** `oa_takedown_creation` remains the active attempt-denominated V2 concept. Time-normalized opponent-adjusted striking/control/submission residuals are `DEFERRED` until elapsed exposure becomes contract-safe.',
              '13. **Which are simulator-specific?** Event intensities/probabilities and persistence components; no simulator is built in F00.':
                  '13. **Which are simulator-specific?** `sim_takedown_success_probability` remains the active attempt-denominated simulator component. Time-intensity, interval-hazard, and persistence components are `DEFERRED`; no simulator is built in F00.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing summary anchor: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit summary correction
        shell: bash
        run: |
          set -euo pipefail
          python -m ufc_edge.features.contract
          python -m unittest discover -s tests/features -p 'test_*.py' -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/FEATURE_CONTRACT.md
          git commit -m 'docs: align F00 summary with exposure gate'
          git push origin HEAD:feat/feature-contract-f00
