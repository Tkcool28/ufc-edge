name: Build strict sample UFC judge-round candidates v0
on:
  push:
    branches: [main]
    paths:
      - "pipelines/build_ufc_scorecard_judge_round_candidate_sample_v0.py"
      - "data/derived/qa/ufc_scorecard_adaptive_cell_ocr_v0.csv"
      - "data/derived/qa/ufc_scorecard_judge_identity_reconciliation_v0.csv"
      - ".github/workflows/build-ufc-scorecard-judge-round-candidate-sample.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build strict sample candidate and commit
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin "${{ github.ref_name }}"
          mkdir -p provenance/runs provenance/audits data/derived/qa
          log="provenance/runs/ufc_scorecard_judge_round_candidate_sample_v0_${GITHUB_RUN_ID}.log"
          set +e; python pipelines/build_ufc_scorecard_judge_round_candidate_sample_v0.py >"$log" 2>&1; code=$?; set -e
          python - "$code" "$log" <<'PY'
          import json,os,sys
          from datetime import datetime,timezone
          code,log=int(sys.argv[1]),sys.argv[2]
          p={"schema_version":1,"build":"ufc_scorecard_judge_round_candidate_sample_v0","status":"success" if code==0 else "failed","exit_code":code,"github_run_id":os.environ.get("GITHUB_RUN_ID"),"trigger_sha":os.environ.get("GITHUB_SHA"),"completed_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),"log":log}
          open("provenance/runs/ufc_scorecard_judge_round_candidate_sample_v0_latest.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/ufc_scorecard_judge_round_candidate_sample_v0_latest.json
          if [ "$code" -eq 0 ]; then git add data/derived/qa/ufc_scorecard_judge_round_candidate_sample_v0.csv data/derived/qa/ufc_scorecard_judge_round_candidate_sample_exclusions_v0.csv provenance/audits/ufc_scorecard_judge_round_candidate_sample_v0_latest.json; fi
          git commit -m "Build strict sample UFC judge-round candidates (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}";git push origin "HEAD:${{ github.ref_name }}";exit "$code"
