name: Audit FightMetric rows missing fight identity

on:
  push:
    branches: [main]
    paths:
      - "pipelines/audit_fightmetric_unidentified_rows_v2.py"
      - "src/ufc_edge/data/manifest_readers.py"
      - ".github/workflows/audit-fightmetric-unidentified-rows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit with durable diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/runs
          log="provenance/runs/fightmetric_unidentified_rows_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/audit_fightmetric_unidentified_rows_v2.py >"$log" 2>&1
          code=$?
          set -e

          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          payload = {
              "schema_version": 2,
              "audit": "fightmetric_unidentified_rows",
              "status": "success" if code == 0 else "failed",
              "exit_code": code,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "completed_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "log": log,
              "output": "provenance/audits/fightmetric_unidentified_rows_latest.json" if code == 0 else None,
          }
          with open("provenance/runs/fightmetric_unidentified_rows_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/runs/fightmetric_unidentified_rows_latest.json
          if [ -f provenance/audits/fightmetric_unidentified_rows_latest.json ]; then
            git add provenance/audits/fightmetric_unidentified_rows_latest.json
          fi
          git commit -m "Record FightMetric unidentified-row audit (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
