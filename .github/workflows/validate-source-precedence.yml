name: Validate source precedence

on:
  push:
    branches: [main]
    paths:
      - "schemas/source_precedence_v0.json"
      - "schemas/canonical_data_contract_v0.json"
      - "schemas/source_field_map_v0.json"
      - "pipelines/validate_source_precedence.py"
      - ".github/workflows/validate-source-precedence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate precedence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance/audits provenance/runs
          log="provenance/runs/source_precedence_${GITHUB_RUN_ID}.log"
          set +e
          python pipelines/validate_source_precedence.py >"$log" 2>&1
          code=$?
          set -e
          python - "$code" "$log" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          code, log = int(sys.argv[1]), sys.argv[2]
          text = open(log, encoding="utf-8").read()
          payload = {
              "schema_version": 1,
              "passed": code == 0,
              "exit_code": code,
              "audited_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger_sha": os.environ.get("GITHUB_SHA"),
              "output": text,
          }
          with open("provenance/audits/source_precedence_gate_latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" provenance/audits/source_precedence_gate_latest.json
          git commit -m "Record source precedence validation (${code}) [skip ci]" || true
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          exit "$code"
